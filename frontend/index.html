<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Posts</title>

<style>

    body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
    }

    input,
    textarea {
        display: block;
        width: 100%;
        margin-bottom: 15px;
        padding: 10px;
        box-sizing: border-box;
    }

    textarea {
        height: 150px;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
        margin-right: 5px;
    }

    .post {
        border: 1px solid #ccc;
        padding: 20px;
        margin-top: 20px;
    }

    .post h2 {
        margin-top: 0;
    }

    .post-buttons {
        margin-top: 15px;
    }

    #result {
        margin-top: 20px;
    }

    #logout {
        float: right;
    }

</style>

</head> <body>
<button id="logout">
    Logout
</button>


<h1>Posts</h1>


<h2>Create Post</h2>


<form id="postForm">

    <input
        type="text"
        id="title"
        placeholder="Post title"
        required
    >

    <textarea
        id="body"
        placeholder="Post body"
        required
    ></textarea>

    <button type="submit">
        Create Post
    </button>

</form>


<div id="result"></div>


<hr>


<h2>All Posts</h2>


<div id="posts">
    Loading posts...
</div>


<script>

    /*
    |--------------------------------------------------------------------------
    | API
    |--------------------------------------------------------------------------
    */

    const API_URL =
        'http://127.0.0.1:8000/api';


    /*
    |--------------------------------------------------------------------------
    | Authentication
    |--------------------------------------------------------------------------
    */

    const token =
        localStorage.getItem('token');


    /*
    |--------------------------------------------------------------------------
    | HTML elements
    |--------------------------------------------------------------------------
    */

    const form =
        document.getElementById('postForm');

    const posts =
        document.getElementById('posts');

    const result =
        document.getElementById('result');

    const logoutButton =
        document.getElementById('logout');


    /*
    |--------------------------------------------------------------------------
    | Check login
    |--------------------------------------------------------------------------
    */

    if (!token) {

        window.location.href =
            'login.html';

    }


    /*
    |--------------------------------------------------------------------------
    | Load posts
    |--------------------------------------------------------------------------
    */

    function loadPosts() {

        posts.innerHTML =
            'Loading posts...';


        fetch(`${API_URL}/posts`, {

            method: 'GET',

            headers: {

                'Accept':
                    'application/json'

            }

        })

        .then(async response => {

            const data =
                await response.json();


            console.log(
                'GET /posts:',
                response.status,
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    'Could not load posts'
                );

            }


            return data;

        })

        .then(data => {

            posts.innerHTML = '';


            if (data.length === 0) {

                posts.innerHTML =
                    '<p>No posts yet.</p>';

                return;

            }


            data.forEach(post => {

                showPost(post);

            });

        })

        .catch(error => {

            console.error(
                'LOAD POSTS ERROR:',
                error
            );


            posts.innerHTML =
                '<p>Could not load posts.</p>';

        });

    }


    /*
    |--------------------------------------------------------------------------
    | Show post
    |--------------------------------------------------------------------------
    */

    function showPost(post) {

        const postElement =
            document.createElement('div');


        postElement.className =
            'post';


        postElement.id =
            `post-${post.id}`;


        postElement.innerHTML = `

            <h2>${escapeHtml(post.title)}</h2>

            <p>${escapeHtml(post.body)}</p>

            <div class="post-buttons">

                <button
                    onclick="editPost(${post.id})"
                >
                    Edit
                </button>

                <button
                    onclick="deletePost(${post.id})"
                >
                    Delete
                </button>

            </div>

        `;


        posts.appendChild(postElement);

    }


    /*
    |--------------------------------------------------------------------------
    | Create post
    |--------------------------------------------------------------------------
    */

    form.addEventListener(
        'submit',
        function(event) {

            event.preventDefault();


            const title =
                document
                    .getElementById('title')
                    .value
                    .trim();


            const body =
                document
                    .getElementById('body')
                    .value
                    .trim();


            fetch(`${API_URL}/posts`, {

                method: 'POST',

                headers: {

                    'Content-Type':
                        'application/json',

                    'Accept':
                        'application/json',

                    'Authorization':
                        'Bearer ' + token

                },

                body: JSON.stringify({

                    title: title,

                    body: body

                })

            })

            .then(async response => {

                const data =
                    await response.json();


                console.log(
                    'CREATE:',
                    response.status,
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        'Could not create post'
                    );

                }


                return data;

            })

            .then(post => {

                showPost(post);

                form.reset();

                result.innerHTML =
                    'Post created!';

            })

            .catch(error => {

                console.error(
                    'CREATE ERROR:',
                    error
                );


                result.innerHTML =
                    'Error: ' +
                    error.message;

            });

        }
    );


    /*
    |--------------------------------------------------------------------------
    | Edit post
    |--------------------------------------------------------------------------
    */

    function editPost(id) {

        const postElement =
            document.getElementById(
                `post-${id}`
            );


        const currentTitle =
            postElement
                .querySelector('h2')
                .textContent;


        const currentBody =
            postElement
                .querySelector('p')
                .textContent;


        const newTitle =
            prompt(
                'Enter new title:',
                currentTitle
            );


        if (newTitle === null) {

            return;

        }


        const newBody =
            prompt(
                'Enter new body:',
                currentBody
            );


        if (newBody === null) {

            return;

        }


        fetch(`${API_URL}/posts/${id}`, {

            method: 'PUT',

            headers: {

                'Content-Type':
                    'application/json',

                'Accept':
                    'application/json',

                'Authorization':
                    'Bearer ' + token

            },

            body: JSON.stringify({

                title:
                    newTitle,

                body:
                    newBody

            })

        })

        .then(async response => {

            const data =
                await response.json();


            console.log(
                'EDIT:',
                response.status,
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    'Could not edit post'
                );

            }


            return data;

        })

        .then(updatedPost => {

            /*
            Remove the old version
            */

            const oldPost =
                document.getElementById(
                    `post-${id}`
                );


            oldPost.remove();


            /*
            Add the updated version
            */

            showPost(updatedPost);


            result.innerHTML =
                'Post updated!';

        })

        .catch(error => {

            console.error(
                'EDIT ERROR:',
                error
            );


            result.innerHTML =
                'Error: ' +
                error.message;

        });

    }


    /*
    |--------------------------------------------------------------------------
    | Delete post
    |--------------------------------------------------------------------------
    */

    function deletePost(id) {

        const confirmed =
            confirm(
                'Are you sure you want to delete this post?'
            );


        if (!confirmed) {

            return;

        }


        fetch(`${API_URL}/posts/${id}`, {

            method: 'DELETE',

            headers: {

                'Accept':
                    'application/json',

                'Authorization':
                    'Bearer ' + token

            }

        })

        .then(async response => {

            const data =
                await response.json();


            console.log(
                'DELETE:',
                response.status,
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    'Could not delete post'
                );

            }


            return data;

        })

        .then(() => {

            const postElement =
                document.getElementById(
                    `post-${id}`
                );


            if (postElement) {

                postElement.remove();

            }


            result.innerHTML =
                'Post deleted!';

        })

        .catch(error => {

            console.error(
                'DELETE ERROR:',
                error
            );


            result.innerHTML =
                'Error: ' +
                error.message;

        });

    }


    /*
    |--------------------------------------------------------------------------
    | Logout
    |--------------------------------------------------------------------------
    */

    logoutButton.addEventListener(
        'click',
        function() {

            fetch(`${API_URL}/logout`, {

                method: 'POST',

                headers: {

                    'Accept':
                        'application/json',

                    'Authorization':
                        'Bearer ' + token

                }

            })

            .then(async response => {

                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        'Logout failed'
                    );

                }


                localStorage.removeItem(
                    'token'
                );


                localStorage.removeItem(
                    'user'
                );


                window.location.href =
                    'login.html';

            })

            .catch(error => {

                console.error(
                    'LOGOUT ERROR:',
                    error
                );

            });

        }
    );


    /*
    |--------------------------------------------------------------------------
    | Security
    |--------------------------------------------------------------------------
    */

    function escapeHtml(value) {

        const div =
            document.createElement('div');


        div.textContent =
            value ?? '';


        return div.innerHTML;

    }


    /*
    |--------------------------------------------------------------------------
    | Start
    |--------------------------------------------------------------------------
    */

    loadPosts();

</script>

</body> </html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Posts</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-right: 5px;
        }

        .post {
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
        }

        .post h2 {
            margin-top: 0;
        }

        .post-buttons {
            margin-top: 15px;
        }

        #result {
            margin-top: 20px;
        }

        #logout {
            float: right;
        }


        /*
        |--------------------------------------------------------------------------
        | Loading overlay
        |--------------------------------------------------------------------------
        */

        #loading {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(255, 255, 255, 0.75);

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 9999;

            opacity: 1;

            transition: opacity 0.2s ease;

        }


        #loading.hidden {
            opacity: 0;

            pointer-events: none;
        }


        /*
        |--------------------------------------------------------------------------
        | Spinner
        |--------------------------------------------------------------------------
        */

        .spinner {

            width: 45px;
            height: 45px;

            border: 5px solid #ddd;

            border-top-color: #3498db;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>


<!--
|--------------------------------------------------------------------------
| Global loading spinner
|--------------------------------------------------------------------------
-->

<div id="loading" class="hidden">

    <div class="spinner"></div>

</div>


<button id="logout">
    Logout
</button>


<h1>Posts</h1>


<h2>Create Post</h2>


<form id="postForm">

    <input
        type="text"
        id="title"
        placeholder="Post title"
        required
    >

    <textarea
        id="body"
        placeholder="Post body"
        required
    ></textarea>

    <button type="submit">
        Create Post
    </button>

</form>


<div id="result"></div>


<hr>


<h2>All Posts</h2>


<div id="posts">
    Loading posts...
</div>


<script>


    /*
    |--------------------------------------------------------------------------
    | API
    |--------------------------------------------------------------------------
    */

    const API_URL =
        'http://127.0.0.1:8000/api';


    /*
    |--------------------------------------------------------------------------
    | Authentication
    |--------------------------------------------------------------------------
    */

    const token =
        localStorage.getItem('token');


    /*
    |--------------------------------------------------------------------------
    | HTML elements
    |--------------------------------------------------------------------------
    */

    const form =
        document.getElementById('postForm');

    const posts =
        document.getElementById('posts');

    const result =
        document.getElementById('result');

    const logoutButton =
        document.getElementById('logout');

    const loading =
        document.getElementById('loading');


    /*
    |--------------------------------------------------------------------------
    | Loading functions
    |--------------------------------------------------------------------------
    */

    function showLoading() {

        loading.classList.remove('hidden');

    }


    function hideLoading() {

        loading.classList.add('hidden');

    }


    /*
    |--------------------------------------------------------------------------
    | API helper
    |--------------------------------------------------------------------------
    |
    | Visi fetch() requesti iet caur šo funkciju.
    |
    */

    async function apiFetch(url, options = {}) {

    showLoading();

    try {

        const token =
            localStorage.getItem('token');


        const response =
            await fetch(url, {

                ...options,

                headers: {

                    'Accept':
                        'application/json',

                    /*
                    |--------------------------------------------------------------------------
                    | Always send the Sanctum token
                    |--------------------------------------------------------------------------
                    */

                    'Authorization':
                        'Bearer ' + token,

                    /*
                    |--------------------------------------------------------------------------
                    | Keep any headers supplied by the request
                    |--------------------------------------------------------------------------
                    */

                    ...(options.headers || {})

                }

            });


        const data =
            await response.json();


        console.log(
            `${options.method || 'GET'} ${url}:`,
            response.status,
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                'Request failed'
            );

        }


        return data;

    }

    finally {

        hideLoading();

    }

}



    /*
    |--------------------------------------------------------------------------
    | Check login
    |--------------------------------------------------------------------------
    */

    if (!token) {

        window.location.href =
            'login.html';

    }


    /*
    |--------------------------------------------------------------------------
    | Load posts
    |--------------------------------------------------------------------------
    */

    async function loadPosts() {

        posts.innerHTML =
            'Loading posts...';

        try {

            const data =
                await apiFetch(
                    `${API_URL}/posts`,
                    {
                        method: 'GET',

                        headers: {
                            'Accept':
                                'application/json'
                        }
                    }
                );


            posts.innerHTML = '';


            if (data.length === 0) {

                posts.innerHTML =
                    '<p>No posts yet.</p>';

                return;

            }


            data.forEach(post => {

                showPost(post);

            });

        }

        catch (error) {

            console.error(
                'LOAD POSTS ERROR:',
                error
            );


            posts.innerHTML =
                '<p>Could not load posts.</p>';

        }

    }


    /*
    |--------------------------------------------------------------------------
    | Show post
    |--------------------------------------------------------------------------
    */

    function showPost(post) {

        const postElement =
            document.createElement('div');


        postElement.className =
            'post';


        postElement.id =
            `post-${post.id}`;


        postElement.innerHTML = `

            <h2>
                ${escapeHtml(post.title)}
            </h2>

            <p>
                ${escapeHtml(post.body)}
            </p>

            <div class="post-buttons">

                <button
                    onclick="editPost(${post.id})"
                >
                    Edit
                </button>

                <button
                    onclick="deletePost(${post.id})"
                >
                    Delete
                </button>

            </div>

        `;


        posts.appendChild(postElement);

    }


    /*
    |--------------------------------------------------------------------------
    | Create post
    |--------------------------------------------------------------------------
    */

    form.addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();


            const title =
                document
                    .getElementById('title')
                    .value
                    .trim();


            const body =
                document
                    .getElementById('body')
                    .value
                    .trim();


            try {

                const post =
                    await apiFetch(
                        `${API_URL}/posts`,
                        {
                            method: 'POST',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Accept':
                                    'application/json',

                                'Authorization':
                                    'Bearer ' + token

                            },

                            body: JSON.stringify({

                                title: title,

                                body: body

                            })

                        }
                    );


                showPost(post);

                form.reset();


                result.innerHTML =
                    'Post created!';

            }

            catch (error) {

                console.error(
                    'CREATE ERROR:',
                    error
                );


                result.innerHTML =
                    'Error: ' +
                    error.message;

            }

        }
    );


    /*
    |--------------------------------------------------------------------------
    | Edit post
    |--------------------------------------------------------------------------
    */

    async function editPost(id) {

        const postElement =
            document.getElementById(
                `post-${id}`
            );


        const currentTitle =
            postElement
                .querySelector('h2')
                .textContent;


        const currentBody =
            postElement
                .querySelector('p')
                .textContent;


        const newTitle =
            prompt(
                'Enter new title:',
                currentTitle
            );


        if (newTitle === null) {

            return;

        }


        const newBody =
            prompt(
                'Enter new body:',
                currentBody
            );


        if (newBody === null) {

            return;

        }


        try {

            const updatedPost =
                await apiFetch(
                    `${API_URL}/posts/${id}`,
                    {
                        method: 'PUT',

                        headers: {

                            'Content-Type':
                                'application/json',

                            'Accept':
                                'application/json',

                            'Authorization':
                                'Bearer ' + token

                        },

                        body: JSON.stringify({

                            title:
                                newTitle,

                            body:
                                newBody

                        })

                    }
                );


            const oldPost =
                document.getElementById(
                    `post-${id}`
                );


            oldPost.remove();


            showPost(updatedPost);


            result.innerHTML =
                'Post updated!';

        }

        catch (error) {

            console.error(
                'EDIT ERROR:',
                error
            );


            result.innerHTML =
                'Error: ' +
                error.message;

        }

    }


    /*
    |--------------------------------------------------------------------------
    | Delete post
    |--------------------------------------------------------------------------
    */

    async function deletePost(id) {

        const confirmed =
            confirm(
                'Are you sure you want to delete this post?'
            );


        if (!confirmed) {

            return;

        }


        try {

            await apiFetch(
                `${API_URL}/posts/${id}`,
                {
                    method: 'DELETE',

                    headers: {

                        'Accept':
                            'application/json',

                        'Authorization':
                            'Bearer ' + token

                    }
                }
            );


            const postElement =
                document.getElementById(
                    `post-${id}`
                );


            if (postElement) {

                postElement.remove();

            }


            result.innerHTML =
                'Post deleted!';

        }

        catch (error) {

            console.error(
                'DELETE ERROR:',
                error
            );


            result.innerHTML =
                'Error: ' +
                error.message;

        }

    }


    /*
    |--------------------------------------------------------------------------
    | Logout
    |--------------------------------------------------------------------------
    */

    logoutButton.addEventListener(
        'click',
        async function() {

            try {

                await apiFetch(
                    `${API_URL}/logout`,
                    {
                        method: 'POST',

                        headers: {

                            'Accept':
                                'application/json',

                            'Authorization':
                                'Bearer ' + token

                        }
                    }
                );


                localStorage.removeItem(
                    'token'
                );


                localStorage.removeItem(
                    'user'
                );


                window.location.href =
                    'login.html';

            }

            catch (error) {

                console.error(
                    'LOGOUT ERROR:',
                    error
                );

            }

        }
    );


    /*
    |--------------------------------------------------------------------------
    | Security
    |--------------------------------------------------------------------------
    */

    function escapeHtml(value) {

        const div =
            document.createElement('div');


        div.textContent =
            value ?? '';


        return div.innerHTML;

    }


    /*
    |--------------------------------------------------------------------------
    | Start
    |--------------------------------------------------------------------------
    */

    loadPosts();


</script>

</body>

</html>

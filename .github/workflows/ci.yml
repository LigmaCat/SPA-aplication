name: CI Pipeline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Laravel Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: laravel-api

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP code style
        run: vendor/bin/pint --test

  frontend-lint:
    name: React TypeScript Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: React TypeScript Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  backend-test:
    name: Laravel Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: laravel-api

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test